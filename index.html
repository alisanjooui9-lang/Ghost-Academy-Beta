}

body{

margin:0;
background:#050505;
color:white;
font-family:tahoma;

}


body.light{

background:#eee;
color:#111;

}



header{

background:#111;
padding:35px;
text-align:center;
border-bottom:3px solid #00ff99;
box-shadow:0 0 20px #00ff99;

}


.light header{

}


.logo{

color:#00ff99;
font-weight:bold;

}



nav{

padding:15px;

}


.light nav{

}



nav a{

color:white;
text-decoration:none;
margin:10px;

}

}



button{

background:#00ff99;
border:0;
padding:12px 20px;
border-radius:12px;

cursor:pointer;

}



#theme{

position:fixed;
bottom:20px;
left:20px;

}



.card{

background:#151515;
margin:20px;
padding:25px;
border-radius:20px;
border:1px solid #333;
transition:.3s;

}



.light .card{

background:white;

}



.card:hover{

transform:scale(1.03);
box-shadow:0 0 20px #00ff99;

}



h2{

color:#00ff99;

}



footer{

text-align:center;
padding:25px;
color:#777;

}

</style>

</head>

<script>


function changeTheme(){

document.body.classList.toggle("light");


localStorage.setItem(
"theme",
document.body.classList.contains("light")
?
"light"
:
"dark"
);

}



if(localStorage.getItem("theme")=="light"){

document.body.classList.add("light");

}



</script>
