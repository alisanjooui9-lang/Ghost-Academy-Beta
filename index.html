<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Black Storm Academy Menu</title>

<style>

body{
background:#101010;
font-family:tahoma;
color:white;
margin:0;
padding:20px;
}

.header{
background:#1c1c1c;
padding:20px;
border-radius:15px;
text-align:center;
border:1px solid #333;
}

.logo{
font-size:28px;
font-weight:bold;
}

.card{
background:#181818;
margin-top:15px;
padding:15px;
border-radius:15px;
}

.btn{

display:block;
background:#222;
color:white;
text-decoration:none;
padding:15px;
margin:10px 0;
border-radius:12px;
font-size:18px;
border:1px solid #333;

}

.btn:hover{

background:#00c853;

}

.info{

display:flex;
justify-content:space-around;
background:#222;
padding:15px;
border-radius:12px;
margin-top:15px;

}

</style>

</head>


<body>


<div class="header">

<div class="logo">
🔥 Black Storm Academy 🔥
</div>

<p>
آموزش حرفه‌ای کالاف دیوتی موبایل
</p>

</div>


<div class="info">

<div>
⭐ XP
<br>
<span id="xp">0</span>
</div>


<div>
💰 سکه
<br>
<span id="coins">0</span>
</div>


<div>
🏆 رنک
<br>
<span id="rank">Recruit</span>
</div>


</div>



<div class="card">


<a class="btn" href="tutorials.html">
📚 آموزش ها
</a>


<a class="btn" href="missions.html">
🎯 ماموریت های روزانه
</a>


<a class="btn" href="shop.html">
🛒 فروشگاه
</a>


<a class="btn" href="leaderboard.html">
🏆 جدول رتبه بندی
</a>


<a class="btn" href="profile.html">
👤 پروفایل
</a>


<a class="btn" href="news.html">
📰 اخبار
</a>


<a class="btn" href="settings.html">
⚙️ تنظیمات
</a>


</div>



<script>


let xp = localStorage.getItem("xp") || 0;

let coins = localStorage.getItem("coins") || 0;


document.getElementById("xp").innerHTML = xp;

document.getElementById("coins").innerHTML = coins;



if(xp >= 1000){

document.getElementById("rank").innerHTML="👑 Legend";

}

else if(xp >= 500){

document.getElementById("rank").innerHTML="🔥 Master";

}

else if(xp >= 200){

document.getElementById("rank").innerHTML="⚡ Elite";

}



</script>


</body>
</html>
