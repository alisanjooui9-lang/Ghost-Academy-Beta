<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GHOST ACADEMY</title>

<style>

body{
background:#050505;
color:white;
font-family:tahoma;
margin:0;
padding:20px;
}


.header{

background:linear-gradient(135deg,#111,#252525);
padding:25px;
border-radius:20px;
text-align:center;
border:1px solid #444;

}


.logo{

font-size:35px;
font-weight:bold;
letter-spacing:3px;

}


.text{

color:#aaa;
margin-top:10px;

}



.profile{

background:#111;
margin-top:20px;
padding:15px;
border-radius:18px;
display:flex;
justify-content:space-around;
border:1px solid #333;

}


.box{

text-align:center;

}



.menu{

margin-top:25px;

}


.menu a{

display:block;
background:#151515;
color:white;
text-decoration:none;
padding:17px;
margin:12px 0;
border-radius:15px;
font-size:18px;
border:1px solid #333;
transition:.3s;

}


.menu a:hover{

background:#333;
transform:scale(1.04);

}



.logout{

background:#300;

}


</style>

</head>


<body>


<div class="header">

<div class="logo">
👻 GHOST ACADEMY
</div>

<div class="text">
Gaming Studio • Call of Duty Academy
</div>

</div>



<div class="profile">


<div class="box">

⭐ XP

<br>

<span id="xp">0</span>

</div>


<div class="box">

💰 Coins

<br>

<span id="coins">0</span>

</div>



<div class="box">

🏆 Rank

<br>

<span id="rank">
Recruit
</span>

</div>



</div>




<div class="menu">


<a href="tutorials.html">
📚 Tutorials | آموزش‌ها
</a>


<a href="missions.html">
🎯 Daily Missions | ماموریت روزانه
</a>


<a href="shop.html">
🛒 Ghost Shop | فروشگاه
</a>


<a href="leaderboard.html">
🏆 Leaderboard | رتبه‌بندی
</a>


<a href="profile.html">
👤 My Profile | پروفایل
</a>


<a href="news.html">
📰 News | اخبار
</a>


<a href="settings.html">
⚙️ Settings | تنظیمات
</a>


<a class="logout" href="login.html">
🚪 Logout | خروج
</a>


</div>



<script>


let xp = Number(localStorage.getItem("xp")) || 0;

let coins = Number(localStorage.getItem("coins")) || 0;



document.getElementById("xp").innerHTML=xp;

document.getElementById("coins").innerHTML=coins;



let rank="Recruit";


if(xp>=200)
rank="Elite";


if(xp>=500)
rank="Master";


if(xp>=1000)
rank="Legend 👑";


document.getElementById("rank").innerHTML=rank;



</script>


</body>

</html>
