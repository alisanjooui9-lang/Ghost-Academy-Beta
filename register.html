<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GHOST ACADEMY Register</title>

<style>

body{

background:#050505;
color:white;
font-family:tahoma;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;

}


.register-box{

background:#111;
width:85%;
padding:25px;
border-radius:20px;
border:1px solid #333;
box-shadow:0 0 30px black;
text-align:center;

}


.logo{

font-size:32px;
font-weight:bold;
margin-bottom:15px;

}


p{

color:#aaa;

}


input{

width:90%;
padding:15px;
margin:8px;
background:#222;
border:none;
border-radius:12px;
color:white;
font-size:16px;

}


button{

width:95%;
padding:15px;
margin-top:15px;
background:#222;
border:1px solid #444;
border-radius:12px;
color:white;
font-size:18px;

}


button:hover{

background:#333;

}


</style>

</head>


<body>


<div class="register-box">


<div class="logo">

👻 GHOST ACADEMY

</div>


<p>
ساخت حساب جدید
</p>



<input id="newUser" placeholder="نام کاربری">


<input id="newPass" type="password" placeholder="رمز عبور">



<input id="confirmPass" type="password" placeholder="تکرار رمز عبور">



<button onclick="register()">

🔥 Create Account

</button>



</div>



<script>


function register(){


let user =
document.getElementById("newUser").value;


let pass =
document.getElementById("newPass").value;


let confirm =
document.getElementById("confirmPass").value;



if(user=="" || pass=="" || confirm==""){

alert("❌ همه بخش ها را پر کنید");

return;

}



if(pass != confirm){

alert("❌ رمزها یکی نیستند");

return;

}



localStorage.setItem("username",user);

localStorage.setItem("password",pass);

localStorage.setItem("xp",0);

localStorage.setItem("coins",0);



alert("🎉 حساب ساخته شد خوش آمدی "+user);



window.location="login.html";


}


</script>



</body>

</html>
