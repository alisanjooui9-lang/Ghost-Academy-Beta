<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leaderboard | Ghost Academy</title>


<style>

body{

margin:0;
background:#050505;
color:white;
font-family:tahoma;
padding:30px;
text-align:center;

}


.box{

max-width:600px;
margin:auto;
background:#151515;
padding:30px;
border-radius:25px;
box-shadow:0 0 20px #00ff99;

}



h1{

color:#00ff99;

}



.player{

background:#222;
margin:15px;
padding:20px;
border-radius:20px;

}



.gold{

border:2px solid gold;

}


.silver{

border:2px solid silver;

}


.bronze{

border:2px solid #cd7f32;

}



button{

background:#00ff99;
border:0;
padding:12px 25px;
border-radius:15px;
font-weight:bold;
cursor:pointer;

}


</style>

</head>


<body>



<div class="box">


<h1>
🏆 Leaderboard
</h1>


<div id="list">

</div>


<br>


<a href="index.html">

<button>
⬅ برگشت
</button>

</a>


</div>




<script src="rank.js"></script>



<script>



let players =
JSON.parse(localStorage.getItem("players")) || [];



players.sort((a,b)=>{

return b.level - a.level || b.xp - a.xp;

});



let list=document.getElementById("list");



if(players.length==0){

list.innerHTML="😢 هنوز بازیکنی ثبت نشده";

}




players.forEach((p,index)=>{



let medal="";



if(index==0){

medal="🥇";

}

else if(index==1){

medal="🥈";

}

else if(index==2){

medal="🥉";

}




list.innerHTML += `


<div class="player">


${medal} رتبه ${index+1}


<br><br>


👤 ${p.name}


<br>


⭐ Level: ${p.level}


<br>


🔥 XP: ${p.xp}


<br>


🎖 رنک:
${getRank(p.level)}



</div>


`;



});



</script>



</body>

</html>
