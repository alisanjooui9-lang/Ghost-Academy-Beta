<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leaderboard | Ghost Academy</title>


<style>

body{

margin:0;
background:#050505;
color:white;
font-family:tahoma;
padding:30px;
text-align:center;

}


.box{

max-width:500px;
margin:auto;
background:#151515;
padding:30px;
border-radius:25px;
border:1px solid #333;
box-shadow:0 0 20px #00ff99;

}


h1,h2{

color:#00ff99;

}



.player{

background:#222;
padding:20px;
margin:15px;
border-radius:20px;

}



button{

background:#00ff99;
border:0;
padding:12px 25px;
border-radius:15px;
font-weight:bold;
cursor:pointer;

}


</style>

</head>


<body>


<div class="box">


<h1>
🏆 Leaderboard
</h1>


<h2>
رتبه‌بندی بازیکن
</h2>



<div class="player">

👤 نام بازیکن:

<br>

<b id="name">
بازیکن ناشناس
</b>

</div>



<div class="player">

⭐ Level:

<br>

<b id="level">
1
</b>

</div>



<div class="player">

🔥 XP:

<br>

<b id="xp">
0
</b>

</div>



<div class="player">

🏅 رتبه:

<br>

<b id="rank">
بازیکن تازه‌کار
</b>

</div>



<br>



<a href="index.html">

<button>
⬅ برگشت
</button>

</a>



</div>




<script>


let name = localStorage.getItem("username") || "بازیکن ناشناس";

let xp = Number(localStorage.getItem("xp")) || 0;

let level = Number(localStorage.getItem("level")) || 1;



document.getElementById("name").innerHTML=name;

document.getElementById("xp").innerHTML=xp;

document.getElementById("level").innerHTML=level;



let rank="بازیکن تازه‌کار";


if(level>=5){

rank="🔥 بازیکن حرفه‌ای";

}


if(level>=10){

rank="👑 استاد Ghost";

}



document.getElementById("rank").innerHTML=rank;



</script>


</body>

</html>
