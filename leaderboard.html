<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leaderboard | Ghost Academy</title>


<style>

body{

background:#050505;
color:white;
font-family:tahoma;
text-align:center;
padding:30px;

}


.box{

background:#151515;
padding:25px;
border-radius:25px;

}


h1{

color:#00ff99;

}


.player{

background:#222;
margin:15px;
padding:15px;
border-radius:15px;

}


button{

background:#00ff99;
padding:12px 25px;
border:0;
border-radius:15px;
font-weight:bold;

}

</style>

</head>


<body>


<div class="box">


<h1>
🏆 رتبه‌بندی بازیکنان
</h1>



<div id="list">

</div>



<br>


<a href="index.html">

<button>
⬅ برگشت
</button>

</a>


</div>




<script>


let players = JSON.parse(localStorage.getItem("players")) || [];



players.sort((a,b)=>{

return b.xp - a.xp;

});



let list=document.getElementById("list");



if(players.length==0){

list.innerHTML="هنوز بازیکنی ثبت نشده 😢";

}



players.forEach((p,index)=>{


list.innerHTML += `


<div class="player">

${index+1}️⃣

<br>

👤 ${p.name}

<br>

🔥 XP: ${p.xp}

<br>

⭐ Level: ${p.level}

</div>


`;



});



</script>



</body>

</html>
