<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پروفایل | Ghost Academy</title>

<style>

body{
margin:0;
background:#050505;
color:white;
font-family:tahoma;
padding:30px;
text-align:center;
transition:.3s;
}


body.light{
background:#eee;
color:#111;
}


.box{

max-width:500px;
margin:auto;
background:#151515;
padding:30px;
border-radius:25px;
box-shadow:0 0 20px #00ff99;

}


.light .box{
background:white;
}


h1,h2{
color:#00ff99;
}


input{

padding:15px;
width:80%;
border-radius:15px;
border:0;

}


button{

background:#00ff99;
border:0;
padding:12px 25px;
border-radius:15px;
font-weight:bold;
cursor:pointer;

}


.xpbar{

height:20px;
background:#333;
border-radius:20px;
overflow:hidden;

}


.xp{

height:100%;
background:#00ff99;

}


.rank{

font-size:22px;
margin:15px;

}


</style>

</head>


<body>



<button onclick="theme()">
🌙 / ☀️
</button>



<div class="box">


<h1>
👤 پروفایل بازیکن
</h1>


<h2 id="name">
بازیکن ناشناس
</h2>


<input id="username" placeholder="نام بازیکن">


<br><br>


<button onclick="saveName()">
💾 ذخیره نام
</button>



<hr>



<p>
⭐ Level:
<span id="level">1</span>
</p>


<p>
🔥 XP:
<span id="xp">0</span>
/100
</p>



<div class="xpbar">

<div class="xp" id="xpBar"></div>

</div>



<h2 class="rank" id="rank">

🥉 Rookie

</h2>




<button onclick="addXP()">

🔥 گرفتن 10 XP

</button>



<br><br>



<a href="leaderboard.html">

<button>
🏆 رتبه‌بندی
</button>

</a>


<br><br>



<a href="index.html">

<button>
⬅ برگشت
</button>

</a>



</div>




<script src="rank.js"></script>



<script>



let xp = Number(localStorage.getItem("xp")) || 0;

let level = Number(localStorage.getItem("level")) || 1;



let oldName = localStorage.getItem("username");


if(oldName){

document.getElementById("name").innerHTML = oldName;

}



function saveName(){


let name = document.getElementById("username").value;


if(name){

localStorage.setItem("username",name);

document.getElementById("name").innerHTML=name;

savePlayer();

}

}





function addXP(){


xp += 10;



if(xp >=100){

xp=0;

level++;

alert("🎉 رنک بالاتر رفت!");

}



localStorage.setItem("xp",xp);

localStorage.setItem("level",level);



savePlayer();

update();



alert("🔥 10 XP گرفتی!");

}




function savePlayer(){


let players =
JSON.parse(localStorage.getItem("players")) || [];



let name =
localStorage.getItem("username") || "بازیکن ناشناس";



let player={

name:name,

xp:xp,

level:level

};



let exists=false;



players = players.map(p=>{


if(p.name==name){

exists=true;

return player;

}


return p;


});



if(!exists){

players.push(player);

}



localStorage.setItem(
"players",
JSON.stringify(players)
);


}




function update(){


document.getElementById("xp").innerHTML=xp;

document.getElementById("level").innerHTML=level;


document.getElementById("xpBar").style.width=xp+"%";



document.getElementById("rank").innerHTML =
getRank(level);


}




function theme(){

document.body.classList.toggle("light");

}



update();



</script>



</body>

</html>
