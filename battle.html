<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>آموزش بتل رویال | Ghost Academy</title>


<style>

body{

margin:0;
background:#050505;
color:white;
font-family:tahoma;
padding:30px;
text-align:center;

}



.box{

background:#151515;
padding:30px;
border-radius:25px;
border:1px solid #333;
box-shadow:0 0 20px #00ff99;

}



h1,h2{

color:#00ff99;

}



.tip{

background:#222;
padding:20px;
border-radius:15px;
line-height:2;

}



button{

background:#00ff99;
border:0;
padding:12px 25px;
border-radius:15px;
font-weight:bold;
cursor:pointer;

}

</style>

</head>



<body>



<div class="box">


<h1>
🏆 آموزش بتل رویال
</h1>


<p>
تاکتیک‌های زنده ماندن و پیروزی در بتل رویال
</p>



<div class="tip">

🔥 نکات حرفه‌ای:

<br>

• انتخاب محل فرود مناسب

<br>

• جمع کردن تجهیزات سریع

<br>

• مدیریت مهمات و سلامتی

<br>

• حرکت هوشمندانه در منطقه امن

<br>

• تصمیم‌گیری در مبارزات آخر

</div>



<br>



<button onclick="completeLesson()">

✅ پایان آموزش +10 XP

</button>



<br><br>



<a href="index.html">

<button>
⬅ برگشت
</button>

</a>


</div>




<script>


function completeLesson(){


let xp = Number(localStorage.getItem("xp")) || 0;

let level = Number(localStorage.getItem("level")) || 1;



xp += 10;



if(xp >=100){

xp = 0;

level++;

alert("👑 تبریک! لول جدید گرفتی!");

}



localStorage.setItem("xp",xp);

localStorage.setItem("level",level);



alert("🔥 10 XP دریافت کردی!");

}



</script>



</body>

</html>
